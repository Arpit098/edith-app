# Copy to config.toml on edith. Secrets (bot token, API token) are read from files/env, never stored here.

[adapters]
agent = "claude_tmux"
stt = "whisper_cpp"
mail = "google"        # adapters/google serves both mail and calendar, with one login
calendar = "google"
frontends = ["telegram", "app_api"]
notifiers = ["telegram"]   # add "ntfy" for app pushes (deploy/ntfy/README.md)

[adapter.claude_tmux]
work_dir = "~/edith"
tmux_socket = "edith"
max_side_lanes = 2

[adapter.whisper_cpp]
url = "http://127.0.0.1:8178"
# The model is loaded by whisper-server.service (WHISPER_MODEL); this records which one, for reference.
# small-q8_0: best accuracy, ~2.4 s for 5 s of English. base-q8_0: the fast option (~1-2 s, drops words).
model = "small-q8_0"
# deadline_floor = 5.0     # give up after max(floor, factor × audio seconds): HTTP 504, not retried
# deadline_factor = 1.5

[adapter.app_api]
bind = "tailscale"          # the Tailscale IP only, never 0.0.0.0
port = 8787
token_file = "~/.config/edith/app-token"

# [adapter.ntfy]            # pushes while the app is closed (contracts/push.md)
# url = "http://100.78.124.98:2586"
# topic = "edith"
# token_file = "~/.config/edith/ntfy-publish-token"

[adapter.google]
credentials_dir = "~/.config/edith-google"   # OAuth client + token; never in git

[adapter.telegram]
telegram_dir = "~/.claude/channels/telegram"   # bot token (.env) and access.json; never in git

[features]
enabled = ["sessions", "approvals", "control", "reminders", "mail", "calendar", "changes", "quick_actions", "voice",
           "app_updates", "message_log", "wakeword", "status", "notifications", "accounts"]

[features.app_updates]
# The release signing certificate's SHA-256 (public). Only APKs signed with it are offered.
cert_sha256 = "2B:6C:D3:6E:EA:02:20:9B:55:D9:7D:7A:78:20:E1:F6:81:A6:B1:60:67:3A:4A:49:F2:2B:43:9F:3F:D8:02:AB"
# repo = "Arpit098/edith-app"; workflow = "build-apk.yml"; branch = "main"; interval = 120 (seconds)

[features.status]
# agents = true            # list the coding agents' tmux sessions (default socket) in /v1/status/details
# agents_socket = ""       # another tmux socket (-L) instead of the default one
# live_dir = "~/edith-app-live"   # the checkout whose `git describe` is reported (default: the running code's)

[features.accounts]
# root = "~/.config/edith/claude-accounts"   # saved Claude logins (700/600); never in git
# service = "edith-claude"     # EDITH's Claude: restarted last by a switch
# agents_socket = ""           # the coding agents' tmux socket (-L), default socket when empty
# ready_timeout = 90           # seconds for every Claude to reach its input box after a switch
# login_ttl = 600              # seconds an unfinished "Add account" sign-in stays open

# [features.notifications]
# via = ["ntfy"]   # notifier adapters it pushes through

# Per-feature settings go in [features.<name>], e.g.:
# [features.reminders]
# timezone = "Asia/Kolkata"
