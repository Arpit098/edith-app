# Builds the EDITH Android APK on GitHub's x86 runners (never on edith: ARM64, PLAN.md §5).
# Expo prebuild + Gradle, no EAS or other paid service.
#
# Publishes, per contracts/app-updates.md §2, the artifacts edith collects from successful `main` runs:
# - `edith-apk`: edith.apk + apk.json (version, versionCode, sha256, runtimeVersion, signing cert);
# - `edith-ota`: the signed expo-updates bundle (only when the OTA signing key is configured).
#
# Signing (§6): the release key from GitHub Secrets (EDITH_KEYSTORE_*) when present, else Expo's public
# debug key, with a warning in the job summary (edith never offers a debug-signed APK). Secrets reach
# only the steps that need them, are written to $RUNNER_TEMP, never echoed, and deleted at the end.
name: build-apk

# Which changes build. GitHub doesn't allow `paths` and `paths-ignore` together, so the ignores are
# `!` patterns; the last pattern matching a file decides. Docs-only changes (Markdown anywhere,
# docs/, wakeword/ except its models) and the logo's source image don't build. Code, assets the app
# ships (icons generated from that source live outside brand/) and wake word models do: each is
# part of the APK or the OTA bundle. Keep the two lists the same.
on:
  push:
    branches: [main] # phase branches build through their PR, not twice
    paths:
      - 'app/**'
      - 'wakeword/models/**'
      - '.github/workflows/build-apk.yml'
      - '!**/*.md'
      - '!app/assets/brand/**'
  pull_request:
    paths:
      - 'app/**'
      - 'wakeword/models/**'
      - '.github/workflows/build-apk.yml'
      - '!**/*.md'
      - '!app/assets/brand/**'
  workflow_dispatch:

concurrency:
  # The branch name for a PR (head_ref) and for a push or manual run (ref_name): a newer run on
  # the same branch cancels the older one, whatever started it.
  group: build-apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx jest --ci

  # Runs alongside `check` (no `needs`): a failing check still fails the PR, and the APK isn't
  # held back by the tests.
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The release certificate Arpit made (contracts/app-updates.md §6): a release build must carry it.
      RELEASE_CERT_SHA256: 2B:6C:D3:6E:EA:02:20:9B:55:D9:7D:7A:78:20:E1:F6:81:A6:B1:60:67:3A:4A:49:F2:2B:43:9F:3F:D8:02:AB
      UPDATES_BASE_URL: http://edith:8787
      # ccache for the C++ the build compiles (expo-modules-core JSI, the app's codegen). CMake reads
      # these launcher variables from the environment. Paths are made relative to the workspace and
      # mtimes ignored, so a fresh checkout still hits the cache.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle downloads and the Gradle build cache
        with:
          cache-read-only: false # also save from PR builds (by default only the default branch saves)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ccache
      - run: npm ci --no-audit --no-fund
      - name: React Native version (for the ccache key)
        id: rn
        run: echo "version=$(node -p "require('react-native/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          # A new entry each run (run_id), restored from the newest one with the same lockfile + RN.
          key: ccache-${{ runner.os }}-rn${{ steps.rn.outputs.version }}-${{ hashFiles('app/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-rn${{ steps.rn.outputs.version }}-${{ hashFiles('app/package-lock.json') }}-
            ccache-${{ runner.os }}-rn${{ steps.rn.outputs.version }}-
      - run: ccache --zero-stats

      - name: Signing keys (from GitHub Secrets, if set)
        id: keys
        env:
          EDITH_KEYSTORE_B64: ${{ secrets.EDITH_KEYSTORE_B64 }} # presence check only
          EDITH_UPDATES_KEY_PEM: ${{ secrets.EDITH_UPDATES_KEY_PEM }} # presence check only
          EDITH_UPDATES_CERT_PEM: ${{ secrets.EDITH_UPDATES_CERT_PEM }}
        run: |
          set -euo pipefail
          umask 077
          echo "EDITH_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          # Keys are only checked for here; each is written to disk in the one step that uses it.
          if [ -n "$EDITH_KEYSTORE_B64" ]; then
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Debug-signed APK"
              echo "No release keystore in GitHub Secrets (EDITH_KEYSTORE_B64), so this APK is signed with Expo's"
              echo "**public** debug key. It installs for testing, but edith will never offer it as an update."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # The OTA private key is only checked for here; it's written to disk in the "OTA bundle"
          # step, after prebuild/Gradle/expo export (third-party code) have run, and deleted at once.
          if [ -n "$EDITH_UPDATES_KEY_PEM" ]; then
            committed=$(openssl x509 -in certs/updates-certificate.pem -outform DER | sha256sum | cut -d' ' -f1)
            if [ -n "$EDITH_UPDATES_CERT_PEM" ]; then
              secret=$(printf '%s\n' "$EDITH_UPDATES_CERT_PEM" | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
              [ "$secret" = "$committed" ] || { echo "::error::EDITH_UPDATES_CERT_PEM differs from app/certs/updates-certificate.pem"; exit 1; }
            fi
            echo "EDITH_UPDATES_SIGNING=1" >> "$GITHUB_ENV"
            echo "ota=1" >> "$GITHUB_OUTPUT"
          else
            echo "ota=0" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ OTA updates off"
              echo "No OTA signing key in GitHub Secrets (EDITH_UPDATES_KEY_PEM): this APK has expo-updates disabled"
              echo "and no \`edith-ota\` bundle is published."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Expo prebuild (generates android/)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: runtimeVersion (fingerprint of the native side)
        id: runtime
        run: |
          rv=$(npx expo-updates runtimeversion:resolve --platform android | node -pe "JSON.parse(require('fs').readFileSync(0)).runtimeVersion")
          [ -n "$rv" ] || { echo "::error::no runtimeVersion"; exit 1; }
          echo "version=$rv" >> "$GITHUB_OUTPUT"

      # arm64 only (every current Android phone). Gradle build cache on (task outputs reused across
      # runs through setup-gradle). No R8/minify, resource shrinking or PNG crunching: they cost
      # build time and buy nothing for this personal app.
      - name: Gradle assembleRelease
        working-directory: app/android
        env:
          EDITH_KEYSTORE_B64: ${{ secrets.EDITH_KEYSTORE_B64 }}
          EDITH_KEYSTORE_PASSWORD: ${{ secrets.EDITH_KEYSTORE_PASSWORD }}
          EDITH_KEY_ALIAS: ${{ secrets.EDITH_KEY_ALIAS }}
          EDITH_KEY_PASSWORD: ${{ secrets.EDITH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$EDITH_KEYSTORE_B64" ]; then
            # The keystore exists only for this step (plugins/with-release-signing.js reads the path).
            export EDITH_KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
            trap 'rm -f "$EDITH_KEYSTORE_PATH"' EXIT
            (umask 077; printf '%s' "$EDITH_KEYSTORE_B64" | base64 -d > "$EDITH_KEYSTORE_PATH")
          fi
          unset EDITH_KEYSTORE_B64
          ./gradlew assembleRelease --no-daemon --build-cache \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false \
            -Pandroid.enablePngCrunchInReleaseBuilds=false \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: ccache hit rate
        if: always()
        run: ccache --show-stats

      - name: Verify and describe the APK (apk.json)
        id: apk
        env:
          SIGNING: ${{ steps.keys.outputs.signing }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out/apk
          mv android/app/build/outputs/apk/release/app-release.apk out/apk/edith.apk
          apk=out/apk/edith.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          # apksigner's digest lines vary by scheme ("Signer #1", "V2 Signer:", …); the parser
          # (tested in scripts/__tests__/cert-digest.test.ts) needs exactly one distinct certificate.
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -i "certificate SHA-256 digest" || true
          digest=$(printf '%s\n' "$certs" | scripts/cert-digest.sh) || { echo "::error::Couldn't read one signing certificate from apksigner"; exit 1; }
          echo "Signing certificate SHA-256: $digest"
          if [ "$SIGNING" = release ] && [ "$digest" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Release build is signed with $digest, expected $RELEASE_CERT_SHA256"; exit 1
          fi
          # expo-updates 57 writes the fingerprint policy's runtimeVersion to assets/fingerprint
          # (utils/build/createFingerprintForBuildAsync.js), and the app reads it from there.
          embedded=$(unzip -p "$apk" assets/fingerprint) || { echo "::error::assets/fingerprint is missing from the APK"; exit 1; }
          # Resolved again after Gradle: the build must not have changed anything the fingerprint hashes
          # (it did once: Kotlin's .kotlin/ in an included build; see fingerprint.config.js).
          after=$(npx expo-updates runtimeversion:resolve --platform android | node -pe "JSON.parse(require('fs').readFileSync(0)).runtimeVersion")
          find node_modules -maxdepth 4 -type d -name .kotlin | sed 's/^/Kotlin state dir (ignored by the fingerprint): /'
          if [ "$embedded" != "$RUNTIME_VERSION" ] || [ "$after" != "$RUNTIME_VERSION" ]; then
            echo "::error::runtimeVersion mismatch: before build $RUNTIME_VERSION, in the APK $embedded, after build $after"; exit 1
          fi
          echo "runtimeVersion check: before build = APK assets/fingerprint = after build = $RUNTIME_VERSION"
          jq -n \
            --arg versionName "$(node -p "require('./app.json').expo.version")" \
            --argjson versionCode "$EDITH_VERSION_CODE" \
            --arg sha "$GITHUB_SHA" --argjson run_id "$GITHUB_RUN_ID" --argjson built_at "$(date +%s)" \
            --arg runtimeVersion "$RUNTIME_VERSION" \
            --argjson size "$(stat -c %s "$apk")" --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --arg cert_sha256 "$digest" --arg signing "$SIGNING" \
            '{versionName: $versionName, versionCode: $versionCode, sha: $sha, run_id: $run_id, built_at: $built_at,
              runtimeVersion: $runtimeVersion, size: $size, sha256: $sha256, cert_sha256: $cert_sha256, signing: $signing}' \
            > out/apk/apk.json
          cat out/apk/apk.json
          {
            echo "### APK"
            echo "| | |"; echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"' out/apk/apk.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: edith-apk
          path: app/out/apk/
          if-no-files-found: error
          retention-days: 30

      - name: OTA bundle (expo export + signed manifest)
        if: steps.keys.outputs.ota == '1'
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
          EDITH_UPDATES_KEY_PEM: ${{ secrets.EDITH_UPDATES_KEY_PEM }}
        run: |
          set -euo pipefail
          # Third-party code first, while the key isn't on disk.
          npx expo export --platform android --output-dir out/ota/dist
          npx expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          # Then the key, for our own script only, and gone right after (also on failure).
          key="$RUNNER_TEMP/ota-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$EDITH_UPDATES_KEY_PEM" > "$key")
          node scripts/ota.js --dir out/ota --runtime-version "$RUNTIME_VERSION" \
            --key "$key" --cert certs/updates-certificate.pem \
            --base-url "$UPDATES_BASE_URL" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --expo-config "$RUNNER_TEMP/expo-config.json"
          rm -f "$key"
          echo "OTA update \`$(jq -r .id out/ota/update.json)\` for runtime \`$RUNTIME_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.ota == '1'
        with:
          name: edith-ota
          path: app/out/ota/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/ota-key.pem"
