# Notifications and Live Alerts on an Android 16 emulator (x86 runner, free and open source tools only):
# builds a debug APK, posts each notification state the JS models make (app/scripts/emulator/
# states.json), checks the foreground service, the Allow button and the tap target, and saves the
# screenshots as the `notification-screenshots` artifact.
#
# It costs about half an hour of runner time, so it runs only by hand (Actions → notifications → Run
# workflow, or `gh workflow run notifications.yml --ref <branch>`), never on its own.
name: notifications

on:
  workflow_dispatch:

concurrency:
  group: notifications-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  emulator:
    name: Notification states on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 50  # hard cap; the emulator steps have their own 15 min caps
    env:
      # ccache for the C++ the build compiles (as in build-apk.yml).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines
      CCACHE_MAXSIZE: 1G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # The build plus the Android 16 system image don't fit the runner's free disk: drop preinstalled
      # toolchains this job never uses (.NET, GHC, CodeQL, Boost, Swift, docker images).
      - name: Free disk space
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ccache
      - run: npm ci --no-audit --no-fund
      - name: The states are the models' (states.json up to date)
        run: npx jest --ci src/__tests__/emulator-states.test.ts
      - name: ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-emu-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-emu-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}-
            ccache-emu-${{ runner.os }}-

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      # The NDK React Native builds with isn't on the runner image. Gradle would download it mid-build
      # with no retry (a cut download fails the job as "Error on ZipFile unknown archive"), so it is
      # installed here, retried with backoff, and cached. Keep the version equal to the app's ndkVersion.
      - name: NDK cache
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: ndk-27.1.12297006
      - name: Install the NDK (cache miss only)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            yes | "$sdkmanager" --install "ndk;27.1.12297006" >/dev/null && exit 0
            echo "::warning::NDK install failed (attempt $attempt); retrying"
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            sleep $((attempt * 15))  # backoff between retries of a failed download, at most 3 tries
          done
          echo "::error::the NDK did not install after 3 tries"; exit 1
      # Debug: it carries the DebugNotificationsReceiver the script drives (src/debug, never in release).
      - name: Gradle assembleDebug (x86_64)
        working-directory: app/android
        run: |
          ./gradlew assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=x86_64 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          # Keep the APK, drop the build intermediates (several GB) before the emulator image lands.
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/edith-debug.apk"
          rm -rf app/build ../node_modules/*/android/build ../node_modules/@*/*/android/build ../android-modules/*/android/build
          df -h /

      - name: KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The Android 16 system image and a booted AVD snapshot are cached: a cache hit boots from the
      # snapshot in seconds instead of a ~90 s cold boot (and skips the image download). Bump the key's
      # version to rebuild them.
      - name: System image and AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: avd-v1-36-google_apis-x86_64-pixel_7
      - name: Create the AVD and its boot snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD snapshot made for the cache"
      # Saved now, not at the end of the job: the snapshot is good even if a later check fails.
      - name: Save the system image and AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: avd-v1-36-google_apis-x86_64-pixel_7
      - name: Mock App API (for the Allow button)
        run: nohup python3 scripts/emulator/mock-api.py 8787 "$RUNNER_TEMP/api.log" >"$RUNNER_TEMP/api.out" 2>&1 &
      - name: Post the states on Android 16
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: true
          # From the cached snapshot, and never written back: every run starts from the same clean boot.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: ./scripts/emulator/post-states.sh "$RUNNER_TEMP/edith-debug.apk" scripts/emulator/states.json out/screenshots "$RUNNER_TEMP/api.log"
      - name: Screenshots in the summary
        if: always()
        run: |
          {
            echo "### Notification states"
            ls out/screenshots 2>/dev/null | sed 's/^/- /' || echo "(none)"
            echo; echo "App API calls from the notification buttons:"
            cat "$RUNNER_TEMP/api.log" 2>/dev/null || echo "(none)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notification-screenshots
          path: app/out/screenshots/
          retention-days: 14
