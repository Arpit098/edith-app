# Live config for edith (steps 6, 8 and 9). Secrets are never in here: the bot token and allowlist
# stay in ~/.claude/channels/telegram, Google tokens in ~/.config/edith-google, the App API token in
# ~/.config/edith/app-token (0600). Paths default to today's live locations (edith/common/paths.py).

[adapters]
agent = "claude_tmux"
stt = "whisper_cpp"
mail = "google"
calendar = "google"
frontends = ["telegram", "app_api"]
notifiers = []

[adapter.claude_tmux]
work_dir = "~/edith"
tmux_socket = "edith"
tmux_target = "edith"
tmux_service = "edith-claude"
max_side_lanes = 2

[adapter.whisper_cpp]
url = "http://127.0.0.1:8178"   # whisper-server.service, localhost only
model = "small-q8_0"            # loaded by whisper-server (WHISPER_MODEL); recorded here for reference

[adapter.google]
credentials_dir = "~/.config/edith-google"

[adapter.telegram]
telegram_dir = "~/.claude/channels/telegram"

[adapter.app_api]
bind = "tailscale"                       # the Tailscale IP only; 0.0.0.0 and others are refused
port = 8787
token_file = "~/.config/edith/app-token" # 0600, 32+ random characters

[features]
enabled = ["sessions", "approvals", "control", "reminders", "mail", "calendar", "changes", "quick_actions", "voice",
           "app_updates"]

[features.app_updates]
# The release signing certificate's SHA-256 (public). Only APKs signed with it are offered.
cert_sha256 = "2B:6C:D3:6E:EA:02:20:9B:55:D9:7D:7A:78:20:E1:F6:81:A6:B1:60:67:3A:4A:49:F2:2B:43:9F:3F:D8:02:AB"
# repo = "Arpit098/edith-app"; workflow = "build-apk.yml"; branch = "main"; interval = 600 (seconds)
