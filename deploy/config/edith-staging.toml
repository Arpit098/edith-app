# Staging config (step 6, deploy/staging/README.md): copy to ~/.config/edith-staging/config.toml.
# Everything is separate from live: a test bot, its own tmux socket and Claude, work dir and state.

[adapters]
agent = "claude_tmux"
mail = "google"
calendar = "google"
frontends = ["telegram"]
notifiers = []

[adapter.claude_tmux]
work_dir = "~/edith-staging"
state_dir = "~/.cache/edith-staging"
tmux_socket = "edith-staging"
tmux_target = "edith-staging"
tmux_service = "edith-claude-staging"
max_side_lanes = 2

[adapter.google]
credentials_dir = "~/.config/edith-google"   # read-only use; Google itself is unchanged by staging

[adapter.telegram]
work_dir = "~/edith-staging"
state_dir = "~/.cache/edith-staging"
telegram_dir = "~/.config/edith-staging/telegram"   # the TEST bot's .env and access.json

[features]
enabled = ["sessions", "approvals", "control", "reminders", "mail", "calendar", "changes", "quick_actions"]

[features.reminders]
state_dir = "~/.cache/edith-staging"
